<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Escritório Lagoa+</title>
<style>
  :root { --bg: #1d1a17; --ink: #f4ecdf; --muted: #a89c8a; --accent: #e8743b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  #hud { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 12px; align-items: flex-start; pointer-events: none; }
  #demand { background: #000a; padding: 8px 12px; border-radius: 8px; flex: 1; max-width: 560px; }
  #demand b { color: var(--accent); }
  #log { position: fixed; bottom: 12px; left: 12px; width: min(420px, calc(100% - 24px)); max-height: 30vh; overflow: auto; background: #000a; border-radius: 8px; padding: 8px 12px; font-size: 12px; }
  #log:empty, #log[hidden] { display: none; }
  #controls { position: fixed; bottom: 12px; right: 12px; display: flex; gap: 8px; }
  #controls button { background: #000a; color: var(--ink); font-weight: 600; min-width: 44px; }
  #log div { color: var(--muted); } #log div b { color: var(--ink); }
  button { pointer-events: auto; background: var(--accent); color: #1d1a17; border: 0; border-radius: 8px; padding: 10px 14px; font-weight: 700; cursor: pointer; min-height: 44px; }
  .meta { font-size: 12px; color: var(--muted); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud">
  <div id="demand">
    <b>Demanda:</b> <span id="demandText">aguardando…</span>
    <div class="meta"><span id="status">conectando…</span> · <span id="clock"></span> · passe o mouse num boneco para ver o nome</div>
  </div>
  <button id="demo" type="button">▶ Demo</button>
</div>
<div id="log" hidden></div>
<div id="controls">
  <button id="zoomOut" type="button" aria-label="Afastar">−</button>
  <button id="zoomIn" type="button" aria-label="Aproximar">+</button>
  <button id="logToggle" type="button" aria-controls="log" aria-expanded="false">Mostrar log</button>
</div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
