<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Escritório Lagoa+</title>
<style>
  :root { --bg: #1d1a17; --ink: #f4ecdf; --muted: #a89c8a; --accent: #e8743b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  #hud { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 12px; align-items: flex-start; pointer-events: none; }
  #demand { background: #000a; padding: 8px 12px; border-radius: 8px; flex: 1; max-width: 560px; }
  #demand b { color: var(--accent); }
  #log { position: fixed; bottom: 12px; left: 12px; width: min(420px, calc(100% - 24px)); max-height: 34vh; overflow: auto; background: #000a; border-radius: 8px; padding: 8px 12px; font-size: 12px; }
  #log div { color: var(--muted); } #log div b { color: var(--ink); }
  button { pointer-events: auto; background: var(--accent); color: #1d1a17; border: 0; border-radius: 8px; padding: 10px 14px; font-weight: 700; cursor: pointer; min-height: 44px; }
  #status { font-size: 12px; color: var(--muted); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud">
  <div id="demand"><b>Demanda:</b> <span id="demandText">aguardando…</span><div id="status">conectando…</div></div>
  <button id="demo" type="button">▶ Demo</button>
</div>
<div id="log"></div>
<script type="module">
import * as THREE from 'three'
import { OrbitControls } from 'three/addons/controls/OrbitControls.js'

// ---------- Floor plan ----------
// Corridor runs along z = 0. North rooms: z ∈ [-12, -1]. South rooms: z ∈ [1, 12].
const ROOMS = {
  diretoria:  { name: 'Diretoria',      x: [-18, -8], side: -1, floor: 0xb9a38a },
  produto:    { name: 'Produto',        x: [-8, 2],   side: -1, floor: 0xc6b49a },
  reuniao:    { name: 'Sala de reunião',x: [2, 18],   side: -1, floor: 0xa9b6a0 },
  dev:        { name: 'Dev',            x: [-18, -2], side: 1,  floor: 0xbfae94 },
  qualidade:  { name: 'Qualidade',      x: [-2, 7],   side: 1,  floor: 0xb3a7b8 },
  cozinha:    { name: 'Cozinha',        x: [7, 12.5],   side: 1,  floor: 0xe3dccf },
  games:      { name: 'Games',          x: [12.5, 18],  side: 1,  floor: 0x8f8fb0 },
}
const DOOR_WIDTH = 1.8
const WALK_SPEED = 3.2
const roomCenterX = (room) => (room.x[0] + room.x[1]) / 2
const doorOf = (room) => new THREE.Vector3(roomCenterX(room), 0, room.side * 1.6)
const hallOf = (room) => new THREE.Vector3(roomCenterX(room), 0, 0)
function roomAt(pos) {
  if (Math.abs(pos.z) < 1) return null
  const side = Math.sign(pos.z)
  return Object.values(ROOMS).find((r) => r.side === side && pos.x >= r.x[0] && pos.x <= r.x[1]) ?? null
}

// role id → name, room, desk [x, z], color.
const ROLES = {
  main:              { name: 'Claude (gerente)',   room: 'diretoria', desk: [-15, -8], color: 0xe8743b },
  'tech-lead':       { name: 'Tech Lead',          room: 'diretoria', desk: [-11, -8], color: 0xd9a441 },
  cto:               { name: 'CTO',                room: 'diretoria', desk: [-13, -4], color: 0xc94f4f },
  'product-owner':   { name: 'PO',                 room: 'produto',   desk: [-5, -8],  color: 0x7fb069 },
  arquiteto:         { name: 'Arquiteto',          room: 'produto',   desk: [-1, -8],  color: 0x9c6ade },
  engenheiro:        { name: 'Eng. Sênior',        room: 'produto',   desk: [-3, -4],  color: 0x4f8fc9 },
  'dev-nuxt':        { name: 'Dev Nuxt (pleno)',   room: 'dev',       desk: [-15, 4],  color: 0x41b883 },
  'dev-ui':          { name: 'Dev UI (pleno)',     room: 'dev',       desk: [-11, 4],  color: 0xe58fb4 },
  'dev-stores':      { name: 'Dev Stores (pleno)', room: 'dev',       desk: [-7, 4],   color: 0xf2c94c },
  'dev-tipos':       { name: 'Dev Tipos (pleno)',  room: 'dev',       desk: [-15, 8],  color: 0x3178c6 },
  'dev-junior':      { name: 'Dev Júnior',         room: 'dev',       desk: [-11, 8],  color: 0xa0d995 },
  'general-purpose': { name: 'Freela',             room: 'dev',       desk: [-7, 8],   color: 0x9e9e9e },
  qa:                { name: 'QA',                 room: 'qualidade', desk: [0.2, 4],  color: 0xff9f43 },
  'code-reviewer':   { name: 'Reviewer Sênior',    room: 'qualidade', desk: [3, 4],    color: 0x8d6e63 },
  'revisor-ui':      { name: 'Revisor UI',         room: 'qualidade', desk: [5.8, 4],  color: 0xb39ddb },
  seguranca:         { name: 'Segurança',          room: 'qualidade', desk: [1.6, 8],  color: 0x333333 },
  infra:             { name: 'Infra',              room: 'qualidade', desk: [4.6, 8],  color: 0x5aa5a0 },
}
// Roles that plan in the meeting room instead of their desk.
const PLANNERS = new Set(['main', 'tech-lead', 'product-owner', 'arquiteto', 'cto', 'engenheiro'])

// ---------- Scene ----------
const scene = new THREE.Scene()
scene.background = new THREE.Color(0x1d1a17)
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 300)
camera.position.set(0, 30, 28)
const renderer = new THREE.WebGLRenderer({ antialias: true })
renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
renderer.setSize(innerWidth, innerHeight)
renderer.shadowMap.enabled = true
document.body.appendChild(renderer.domElement)
const controls = new OrbitControls(camera, renderer.domElement)
const fitCamera = () => { const k = Math.max(1, 1.5 / camera.aspect); camera.position.set(0, 30 * k, 28 * k) }
fitCamera()
controls.target.set(0, 0, 0); controls.maxPolarAngle = Math.PI / 2.2; controls.enableDamping = true

scene.add(new THREE.HemisphereLight(0xfff1dd, 0x3a2f25, 0.9))
const sun = new THREE.DirectionalLight(0xffffff, 1.0)
sun.position.set(10, 30, 14); sun.castShadow = true
Object.assign(sun.shadow.camera, { left: -24, right: 24, top: 24, bottom: -24 })
sun.shadow.mapSize.set(2048, 2048)
scene.add(sun)

const box = (w, h, d, color, opts = {}) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color, ...opts }))
  m.castShadow = true; m.receiveShadow = true; return m
}
const place = (mesh, x, y, z) => { mesh.position.set(x, y, z); scene.add(mesh); return mesh }

function textSprite(text, bg = '#000000cc', fg = '#f4ecdf', size = 36) {
  const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d')
  ctx.font = `bold ${size}px system-ui`; const w = ctx.measureText(text).width + 40
  canvas.width = w; canvas.height = size + 24
  ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(0, 0, w, canvas.height, 16); ctx.fill()
  ctx.font = `bold ${size}px system-ui`; ctx.fillStyle = fg; ctx.textBaseline = 'middle'; ctx.fillText(text, 20, canvas.height / 2 + 2)
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), depthTest: false }))
  sprite.scale.set(w / 100, canvas.height / 100, 1); sprite.renderOrder = 10
  return sprite
}

// Corridor + rooms + walls with doors.
place(box(36, 0.05, 2, 0x8a7d6c), 0, 0, 0)
const WALL_H = 1.4, WALL_T = 0.2, wallColor = 0xefe6d6
for (const room of Object.values(ROOMS)) {
  const [x0, x1] = room.x, cx = roomCenterX(room), w = x1 - x0
  const zIn = room.side, zOut = room.side * 12, cz = (zIn + zOut) / 2
  place(box(w, 0.06, 11, room.floor), cx, 0, cz).castShadow = false
  // Corridor wall split by the door.
  const half = (w - DOOR_WIDTH) / 2
  place(box(half, WALL_H, WALL_T, wallColor), x0 + half / 2, WALL_H / 2, zIn)
  place(box(half, WALL_H, WALL_T, wallColor), x1 - half / 2, WALL_H / 2, zIn)
  place(box(w, WALL_H, WALL_T, wallColor), cx, WALL_H / 2, zOut)
  place(box(WALL_T, WALL_H, 11, wallColor), x0, WALL_H / 2, cz)
  place(box(WALL_T, WALL_H, 11, wallColor), x1, WALL_H / 2, cz)
  const label = textSprite(room.name, '#1d1a17dd', '#f4ecdf', 44)
  label.position.set(cx, 2.4, zOut - room.side * 0.6); scene.add(label)
}

// ---------- Furniture and slots ----------
// A slot is a spot an agent can stand/sit on, with a point to look at.
const slot = (x, z, lookX, lookZ, pose = 'stand') => ({ pos: new THREE.Vector3(x, 0, z), look: new THREE.Vector3(lookX, 0, lookZ), pose, taken: null })

function buildDesk(x, z) {
  place(box(2.4, 0.1, 1.2, 0x8a6a4f), x, 0.9, z)
  for (const dx of [-1.1, 1.1]) for (const dz of [-0.5, 0.5]) place(box(0.08, 0.9, 0.08, 0x5a4636), x + dx, 0.45, z + dz)
  const screenMat = new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0x000000 })
  const screen = new THREE.Mesh(new THREE.BoxGeometry(1, 0.6, 0.05), screenMat); screen.position.set(x, 1.3, z - 0.4); scene.add(screen)
  place(box(0.7, 0.5, 0.7, 0x444444), x, 0.25, z + 1.1)
  return { screenMat, slot: slot(x, z + 1.1, x, z - 2, 'sit') }
}

// Meeting room: long table with seats on both sides.
const MEET_X = 10, MEET_Z = -6.5
place(box(8, 0.12, 2.6, 0x6b4f3a), MEET_X, 0.9, MEET_Z)
place(box(0.3, 0.9, 1.6, 0x4a3628), MEET_X - 3, 0.45, MEET_Z); place(box(0.3, 0.9, 1.6, 0x4a3628), MEET_X + 3, 0.45, MEET_Z)
const tvMeet = new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0x000000 })
place(new THREE.Mesh(new THREE.BoxGeometry(4, 2, 0.1), tvMeet), MEET_X, 2.2, -11.7)
const meetingSlots = []
for (const dx of [-3, -1, 1, 3]) {
  meetingSlots.push(slot(MEET_X + dx, MEET_Z - 1.9, MEET_X + dx, MEET_Z, 'sit'))
  meetingSlots.push(slot(MEET_X + dx, MEET_Z + 1.9, MEET_X + dx, MEET_Z, 'sit'))
}
for (const s of meetingSlots) place(box(0.6, 0.5, 0.6, 0x2f4f4f), s.pos.x, 0.25, s.pos.z)

// Kitchen: counter, coffee machine, fridge, round standing table.
place(box(4.6, 1, 1, 0xdedede), 9.6, 0.5, 11.3)
place(box(0.6, 0.8, 0.5, 0x222222), 8.4, 1.4, 11.3)
place(box(1.2, 2.4, 1, 0xf5f5f5), 11.7, 1.2, 10.8)
const KITCHEN = new THREE.Vector3(9.8, 0, 6.2)
const kitchenTable = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 0.08, 24), new THREE.MeshStandardMaterial({ color: 0xffffff }))
place(kitchenTable, KITCHEN.x, 1.1, KITCHEN.z)
place(new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.1), new THREE.MeshStandardMaterial({ color: 0x777777 })), KITCHEN.x, 0.55, KITCHEN.z)
const kitchenSlots = []
for (let i = 0; i < 8; i++) {
  const a = (i / 8) * Math.PI * 2
  kitchenSlots.push(slot(KITCHEN.x + Math.cos(a) * 1.7, KITCHEN.z + Math.sin(a) * 1.7, KITCHEN.x, KITCHEN.z, 'chat'))
}
kitchenSlots.push(slot(8.4, 10.2, 8.4, 11.3, 'coffee'))

// Game room: TV, couch, bean bags.
const tvGame = new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0x2244aa })
place(new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.8, 0.1), tvGame), 15, 1.8, 11.7)
place(box(3.4, 0.3, 0.4, 0x333333), 15, 0.6, 11.5)
place(box(4, 0.5, 1.1, 0x7a3b5c), 15, 0.25, 7)
place(box(4, 0.9, 0.3, 0x7a3b5c), 15, 0.7, 6.4)
const gameSlots = [-1.3, 0, 1.3].map((dx) => slot(15 + dx, 7.2, 15 + dx, 11.7, 'game'))
gameSlots.push(slot(13.4, 9, 15, 11.7, 'game'), slot(16.6, 9, 15, 11.7, 'game'))
// Fans cheering behind the couch.
const fanSlots = [13.6, 15, 16.4].map((x) => slot(x, 4.6, 15, 11.7, 'chat'))
for (const s of gameSlots.slice(3)) place(new THREE.Mesh(new THREE.SphereGeometry(0.5, 12, 8), new THREE.MeshStandardMaterial({ color: 0xe8a33b })), s.pos.x, 0.3, s.pos.z)

// Plants for life.
for (const [x, z] of [[-17, -11], [1.5, -11], [-17, 11], [6.4, 11.3], [17.5, -1.5]]) {
  place(box(0.6, 0.6, 0.6, 0x8a5a3c), x, 0.3, z)
  place(new THREE.Mesh(new THREE.SphereGeometry(0.6, 10, 8), new THREE.MeshStandardMaterial({ color: 0x4f8a4b })), x, 1.1, z)
}

// ---------- Agents ----------
const agents = {}
function buildAgent(id, role) {
  const desk = buildDesk(role.desk[0], role.desk[1])
  const body = new THREE.Group()
  const mat = new THREE.MeshStandardMaterial({ color: role.color })
  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 0.5, 4, 12), mat); torso.position.y = 1.05; torso.castShadow = true
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), new THREE.MeshStandardMaterial({ color: 0xf1c9a5 })); head.position.y = 1.7; head.castShadow = true
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0x1d1a17 })
  for (const dx of [-0.09, 0.09]) { const eye = new THREE.Mesh(new THREE.SphereGeometry(0.04), eyeMat); eye.position.set(dx, 1.75, 0.22); body.add(eye) }
  const legs = [-0.13, 0.13].map((dx) => {
    const pivot = new THREE.Group(); pivot.position.set(dx, 0.6, 0)
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.6, 0.16), new THREE.MeshStandardMaterial({ color: 0x2d2a26 }))
    leg.position.y = -0.3; leg.castShadow = true; pivot.add(leg); body.add(pivot); return pivot
  })
  const controller = box(0.3, 0.08, 0.15, 0x222222); controller.position.set(0, 1.0, 0.4); controller.visible = false
  const mug = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.15, 10), new THREE.MeshStandardMaterial({ color: 0xffffff }))
  mug.position.set(0.3, 1.15, 0.25); mug.visible = false
  body.add(torso, head, controller, mug)
  const label = textSprite(role.name); label.position.y = 2.35; body.add(label)
  body.position.copy(desk.slot.pos); scene.add(body)
  desk.slot.taken = id
  agents[id] = {
    id, role, body, legs, controller, mug, desk, screenMat: desk.screenMat,
    mode: 'idle', slot: desk.slot, path: [], bubble: null, bubbleUntil: 0,
    phase: Math.random() * 6, nextIdleAt: 0, nextChatAt: 0,
  }
}
for (const [id, role] of Object.entries(ROLES)) buildAgent(id, role)

function agentFor(id) {
  if (!agents[id]) { ROLES[id] = { name: id, room: 'dev', desk: [-3, 11], color: 0x9e9e9e }; buildAgent(id, ROLES[id]) }
  return agents[id]
}

function say(agent, text, seconds = 0) {
  if (agent.bubble) agent.body.remove(agent.bubble)
  agent.bubble = null
  if (!text) return
  agent.bubble = textSprite(text, '#f4ecdfee', '#1d1a17'); agent.bubble.position.y = 3.0; agent.body.add(agent.bubble)
  agent.bubbleUntil = seconds ? performance.now() + seconds * 1000 : Infinity
}

// Route through the doors so nobody walks through walls.
function routeTo(agent, target) {
  const from = agent.body.position, path = []
  const a = roomAt(from), b = roomAt(target.pos)
  if (a !== b) {
    if (a) path.push(doorOf(a), hallOf(a))
    if (b) path.push(hallOf(b), doorOf(b))
  }
  path.push(target.pos.clone())
  agent.path = path
}

function moveTo(agent, target) {
  if (agent.slot === target) return
  if (agent.slot && agent.slot.taken === agent.id) agent.slot.taken = null
  target.taken = agent.id
  agent.slot = target
  routeTo(agent, target)
}

const free = (slots) => slots.filter((s) => !s.taken)
const pick = (list) => list[Math.floor(Math.random() * list.length)]

function goIdle(agent) {
  agent.mode = 'idle'
  agent.screenMat.emissive.setHex(0)
  const games = [...gameSlots, ...fanSlots]
  const options = Math.random() < 0.5 ? free(kitchenSlots) : free(games)
  const target = options.length ? pick(options) : pick(free([...kitchenSlots, ...games])) ?? agent.desk.slot
  moveTo(agent, target)
  agent.nextIdleAt = performance.now() + 20000 + Math.random() * 25000
}
function goWork(agent, text) {
  agent.mode = 'work'
  const target = PLANNERS.has(agent.id) ? (free(meetingSlots)[0] ?? agent.desk.slot) : agent.desk.slot
  if (target === agent.desk.slot && agent.desk.slot.taken && agent.desk.slot.taken !== agent.id) agents[agent.desk.slot.taken] && goIdle(agents[agent.desk.slot.taken])
  moveTo(agent, target)
  say(agent, text || 'trabalhando…')
  if (target !== agent.desk.slot) tvMeet.emissive.setHex(0x3a7bd5)
}

const CHAT_LINES = ['☕ cafézinho?', 'haha', 'viu o jogo ontem?', 'deploy na sexta não', 'bora almoçar?', 'quem quebrou o CI?', 'kkkk', '🍩']
const GAME_LINES = ['🎮 GG!', 'mais uma!', 'lag!!', '🏆', 'revanche', 'pausa aí']

// ---------- Events ----------
const papers = []
function handoff(fromId, toId) {
  const from = agentFor(fromId).body.position, to = agentFor(toId).body.position
  const mesh = box(0.4, 0.02, 0.55, 0xffffff)
  scene.add(mesh); papers.push({ mesh, from: from.clone(), to: to.clone(), t: 0 })
}

let lastActive = 'main'
const logEl = document.getElementById('log')
function log(html) { const d = document.createElement('div'); d.innerHTML = html; logEl.prepend(d) }
const anyPlannerWorking = () => Object.values(agents).some((a) => a.mode === 'work' && PLANNERS.has(a.id) && meetingSlots.includes(a.slot))

function handle(event) {
  if (event.type === 'demand') {
    document.getElementById('demandText').textContent = event.text
    goWork(agentFor('main'), 'nova demanda!')
    lastActive = 'main'; log(`<b>Você</b> → ${event.text}`)
    return
  }
  if (event.type === 'agentStart') {
    const a = agentFor(event.role)
    handoff(lastActive, event.role); lastActive = event.role
    goWork(a, event.text)
    a.screenMat.emissive.setHex(0x4fc3f7)
    if (!PLANNERS.has(event.role) && agents.main.mode === 'work' && agents.main.slot !== agents.main.desk.slot) moveTo(agents.main, agents.main.desk.slot)
    log(`<b>${a.role.name}</b> começou: ${event.text ?? ''}`)
    return
  }
  if (event.type === 'agentDone') {
    const a = agentFor(event.role)
    say(a, '✓ feito', 2.5)
    handoff(event.role, 'main'); lastActive = 'main'
    setTimeout(() => { goIdle(a); if (!anyPlannerWorking()) tvMeet.emissive.setHex(0) }, 2500)
    log(`<b>${a.role.name}</b> entregou`)
    return
  }
  if (event.type === 'tool') {
    const a = agentFor(event.role)
    if (a.mode !== 'work' && event.role !== 'main') return
    a.screenMat.emissive.setHex(0x81c784)
    say(a, `🔧 ${event.tool}`, 1.5)
    setTimeout(() => { if (a.mode === 'work') a.screenMat.emissive.setHex(0x4fc3f7) }, 600)
    return
  }
  if (event.type === 'idle') {
    for (const a of Object.values(agents)) if (a.mode === 'work') goIdle(a)
    tvMeet.emissive.setHex(0)
    log('<b>Equipe</b> liberada 🎉')
  }
}

const statusEl = document.getElementById('status')
const source = new EventSource('/events')
source.onopen = () => { statusEl.textContent = 'ao vivo (hooks)' }
source.onerror = () => { statusEl.textContent = 'sem conexão com o servidor — use a Demo' }
source.onmessage = (msg) => handle(JSON.parse(msg.data))

    [0, { type: 'demand', text: 'Adicionar filtro por ramo no Descobrir' }],
    [1, { type: 'agentStart', role: 'tech-lead', text: 'triagem: tamanho G' }],
    [5, { type: 'agentDone', role: 'tech-lead' }],
    [6, { type: 'agentStart', role: 'product-owner', text: 'escrevendo spec.md' }],
    [6.5, { type: 'agentStart', role: 'arquiteto', text: 'solution-design' }],
    [11, { type: 'agentDone', role: 'product-owner' }],
    [12, { type: 'agentStart', role: 'cto', text: 'aprovando design' }],
    [15, { type: 'agentDone', role: 'arquiteto' }], [16, { type: 'agentDone', role: 'cto' }],
    [17, { type: 'agentStart', role: 'dev-nuxt', text: 'filtro na tela' }],
    [17.3, { type: 'agentStart', role: 'dev-tipos', text: 'schema shopGroup' }],
    [17.6, { type: 'agentStart', role: 'dev-junior', text: 'textos pt-BR' }],
    [21, { type: 'tool', role: 'dev-nuxt', tool: 'Edit' }], [22, { type: 'tool', role: 'dev-tipos', tool: 'Write' }],
    [24, { type: 'agentDone', role: 'dev-junior' }], [26, { type: 'agentDone', role: 'dev-tipos' }], [27, { type: 'agentDone', role: 'dev-nuxt' }],
    [28, { type: 'agentStart', role: 'qa', text: 'testes Vitest' }],
    [28.3, { type: 'agentStart', role: 'seguranca', text: 'checando dado pessoal' }],
    [33, { type: 'agentDone', role: 'qa' }], [34, { type: 'agentDone', role: 'seguranca' }],
    [35, { type: 'agentStart', role: 'code-reviewer', text: 'revisando diff' }], [39, { type: 'agentDone', role: 'code-reviewer' }],
    [41, { type: 'idle' }],
  ]
  for (const [sec, event] of steps) setTimeout(() => handle(event), sec * 1000)
}

// Start: everyone hanging out except the manager.
for (const a of Object.values(agents)) if (a.id !== 'main') { goIdle(a); a.body.position.copy(a.slot.pos); a.path = [] }

// ---------- Loop ----------
const clock = new THREE.Clock()
const tmp = new THREE.Vector3()
function animate() {
  const dt = Math.min(clock.getDelta(), 1), t = clock.elapsedTime, now = performance.now()
  for (const a of Object.values(agents)) {
    const p = a.body.position
    const walking = a.path.length > 0
    if (walking) {
      const next = a.path[0]
      tmp.subVectors(next, p); tmp.y = 0
      const dist = tmp.length()
      if (dist < 0.08) a.path.shift()
      else {
        tmp.normalize().multiplyScalar(Math.min(dist, WALK_SPEED * dt)); p.add(tmp)
        a.body.rotation.y = Math.atan2(tmp.x, tmp.z)
      }
    }
    const pose = walking ? 'walk' : a.slot.pose
    const swing = pose === 'walk' ? Math.sin(t * 10 + a.phase) * 0.6 : 0
    a.legs[0].rotation.x = pose === 'sit' || pose === 'game' ? -1.3 : swing
    a.legs[1].rotation.x = pose === 'sit' || pose === 'game' ? -1.3 : -swing
    p.y = pose === 'sit' || pose === 'game' ? -0.15 : pose === 'walk' ? Math.abs(Math.sin(t * 10 + a.phase)) * 0.06 : 0
    if (!walking) {
      tmp.subVectors(a.slot.look, p)
      a.body.rotation.y = Math.atan2(tmp.x, tmp.z)
      if (a.mode === 'work' && pose === 'sit') p.y += Math.abs(Math.sin(t * 14 + a.phase)) * 0.03
      if (pose === 'game') a.body.rotation.y += Math.sin(t * 6 + a.phase) * 0.15
      if (pose === 'chat') a.body.rotation.y += Math.sin(t * 1.5 + a.phase) * 0.4
    }
    a.controller.visible = !walking && pose === 'game'
    a.mug.visible = !walking && (pose === 'chat' || pose === 'coffee')

    if (a.mode === 'idle' && !walking) {
      if (now > a.nextChatAt) {
        a.nextChatAt = now + 6000 + Math.random() * 10000
        if (Math.random() < 0.6) say(a, pick(pose === 'game' ? GAME_LINES : CHAT_LINES), 2.5)
      }
      if (now > a.nextIdleAt) goIdle(a)
    }
    if (a.bubble && now > a.bubbleUntil) say(a, null)
  }
  tvGame.emissive.setHSL((t * 0.15) % 1, 0.7, 0.35)
  for (let i = papers.length - 1; i >= 0; i--) {
    const pp = papers[i]; pp.t += dt / 1.2
    pp.mesh.position.lerpVectors(pp.from, pp.to, Math.min(pp.t, 1)); pp.mesh.position.y = 1.8 + Math.sin(Math.min(pp.t, 1) * Math.PI) * 3
    pp.mesh.rotation.y += dt * 6
    if (pp.t >= 1) { scene.remove(pp.mesh); papers.splice(i, 1) }
  }
  controls.update(); renderer.render(scene, camera)
}
// Timer instead of requestAnimationFrame: keeps the office alive when the pane is in the background.
setInterval(animate, 1000 / 40)
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); fitCamera(); renderer.setSize(innerWidth, innerHeight) })
</script>
</body>
