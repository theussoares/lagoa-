# Postgres local do Lagoa+, igual ao do CI (postgres:17). Sobe com `pnpm db:up`.
# Só estrutura: o banco local nunca recebe dado do Supabase de produção (celular é dado pessoal, LGPD).
services:
  postgres:
    image: postgres:17
    container_name: lagoa-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lagoa_dev
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - lagoa-pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d lagoa_dev']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lagoa-pgdata:
