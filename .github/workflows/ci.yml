name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lagoa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lagoa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@12
      - run: pnpm install --frozen-lockfile
      - name: API typecheck
        run: pnpm typecheck:api
      - name: Apply migrations to the test database
        run: pnpm --filter @lagoa/api db:migrate
      - name: Test database matches the repo migrations
        run: node apps/api/scripts/check-db-parity.mjs postgresql://postgres:postgres@localhost:5432/lagoa_test --exact
      - name: API tests (with a real Postgres)
        run: pnpm test:api
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lagoa_test
      - name: API build
        run: pnpm build:api
      - name: Web tests
        run: pnpm test
